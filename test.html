<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ตารางจองเวลากิจกรรม</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f5f6fa;
      padding: 20px;
    }

    .card {
      background: #fff;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
    }

    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-primary {
      background: #4CAF50;
      color: #fff;
    }

    .btn-danger {
      background: #e74c3c;
      color: #fff;
    }

    .btn-sm {
      font-size: 12px;
      padding: 4px 8px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th,
    .data-table td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    .data-table th {
      background: #f1f2f6;
    }

    .form-input {
      width: 100%;
      padding: 5px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>

<div class="card">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
    <div class="section-title">📅 ตารางจองเวลากิจกรรม</div>
    <button class="btn btn-primary btn-sm" onclick="addBookingRow()">+ เพิ่มแถว</button>
  </div>

  <div class="table-wrap">
    <table class="data-table" id="booking-table">
      <thead>
        <tr>
          <th>#</th>
          <th>ชื่อโรงเรียน</th>
          <th>ชื่อกิจกรรม</th>
          <th>จำนวน (คน)</th>
          <th>เวลา</th>
          <th>ผู้รับผิดชอบ</th>
          <th style="width:50px;"></th>
        </tr>
      </thead>

      <tbody id="booking-tbody">
        <tr>
          <td>1</td>
          <td><input type="text" class="form-input"></td>
          <td><input type="text" class="form-input"></td>
          <td><input type="number" class="form-input" min="0"></td>
          <td><input type="time" class="form-input"></td>
          <td><input type="text" class="form-input"></td>
          <td>
            <button class="btn btn-danger btn-sm" onclick="deleteBookingRow(this)">✕</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  function addBookingRow() {
    const tbody = document.getElementById("booking-tbody");
    const rowCount = tbody.rows.length + 1;

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${rowCount}</td>
      <td><input type="text" class="form-input"></td>
      <td><input type="text" class="form-input"></td>
      <td><input type="number" class="form-input" min="0"></td>
      <td><input type="time" class="form-input"></td>
      <td><input type="text" class="form-input"></td>
      <td>
        <button class="btn btn-danger btn-sm" onclick="deleteBookingRow(this)">✕</button>
      </td>
    `;

    tbody.appendChild(row);
  }

  function deleteBookingRow(btn) {
    const row = btn.closest("tr");
    row.remove();
    updateRowNumbers();
  }

  function updateRowNumbers() {
    const rows = document.querySelectorAll("#booking-tbody tr");
    rows.forEach((row, index) => {
      row.cells[0].innerText = index + 1;
    });
  }
</script>

</body>
</html>
